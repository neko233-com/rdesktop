[package]
name = "rdesktop-webview"
description = "WebView backend for rdesktop (WebView2/WebKit/WebKitGTK)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
rdesktop-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wry = "0.56"
tao = "0.36"
raw-window-handle = "0.6"
url = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[features]
default = ["os-webview"]
os-webview = []
devtools = ["wry/devtools"]
