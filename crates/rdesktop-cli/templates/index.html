<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rdesktop App</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #34478e; color: #fff; font: 1rem/1.5 system-ui, sans-serif; }
        .container { width: min(72rem, 100%); min-width: 0; padding: clamp(1rem, 4vw, 2rem); text-align: center; overflow-wrap: anywhere; }
        h1 { margin: 0 0 .75rem; font-size: clamp(1.5rem, 5vw, 3rem); line-height: 1.2; }
        h2 { margin: 0 0 1rem; font-size: clamp(1.2rem, 4vw, 1.5rem); }
        p { margin: 0 0 1.25rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: 1.25rem; max-width: 54rem; margin: 2rem auto 0; }
        .card { min-width: 0; padding: clamp(1rem, 3vw, 2rem); border: 1px solid #bdc8dc; border-radius: 1rem; background: #fff; color: #172136; text-align: left; }
        .card code { padding: .1rem .4rem; border-radius: .25rem; background: #e7edf7; color: #172136; overflow-wrap: anywhere; }
        label { display: block; margin-bottom: .4rem; font-weight: 600; }
        .form-row { display: flex; flex-wrap: wrap; gap: .5rem; }
        input, button { min-height: 2.75rem; padding: .6rem .8rem; border: 1px solid #66778d; border-radius: .5rem; font: inherit; }
        input { flex: 1 1 12rem; width: 100%; min-width: 0; background: #fff; color: #172136; }
        input::placeholder { color: #52627a; opacity: 1; }
        button { background: #244e9c; border-color: #244e9c; color: #fff; cursor: pointer; transition: background .15s; }
        button:hover { background: #173c80; }
        :focus-visible { outline: 3px solid #172136; outline-offset: 3px; }
        main:focus-visible { outline-color: #fff; }
        .help { margin: .6rem 0 0; color: #46546b; font-size: .95rem; }
        #result { min-height: 1.5em; margin: 1rem 0 0; overflow-wrap: anywhere; }
        .skip { position: absolute; top: -10rem; left: 1rem; padding: .6rem 1rem; background: #fff; color: #172136; }
        .skip:focus { top: 1rem; }
        .skip:focus-visible { outline-color: #fff; box-shadow: 0 0 0 2px #172136; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
        @media (forced-colors: active) {
            body, .card { background: Canvas; color: CanvasText; }
            .card { border-color: CanvasText; }
            .card code, .help { background: Canvas; color: CanvasText; }
            input { background: Canvas; color: CanvasText; border-color: ButtonText; }
            input::placeholder { color: GrayText; }
            button { background: ButtonFace; color: ButtonText; border-color: ButtonText; }
            button:hover { background: Highlight; color: HighlightText; border-color: ButtonText; }
            .skip { background: Canvas; color: LinkText; }
            :focus-visible, main:focus-visible, .skip:focus-visible { outline-color: Highlight; box-shadow: none; }
        }
    </style>
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <main id="main" class="container" tabindex="-1">
        <h1>Hello rdesktop!</h1>
        <p>Your app is running.</p>
        <div class="cards">
            <section class="card" aria-labelledby="ipc-title">
                <h2 id="ipc-title">IPC Demo</h2>
                <form id="greet-form">
                    <label for="nameInput">Your name</label>
                    <div class="form-row">
                        <input type="text" id="nameInput" name="name" autocomplete="name" placeholder="Enter your name" aria-describedby="name-help">
                        <button type="submit">Greet</button>
                    </div>
                    <p id="name-help" class="help">Leave blank to greet World. Press Enter to submit.</p>
                </form>
                <p id="result" role="status" aria-live="polite" aria-atomic="true">Ready</p>
            </section>
        </div>
    </main>
    <script>
        const greetingForm = document.getElementById('greet-form');
        greetingForm.addEventListener('submit', event => {
            event.preventDefault();
            void greet();
        });

        async function greet() {
            const name = document.getElementById('nameInput').value || 'World';
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Calling Rust...';
            try {
                if (typeof window.__RDESKTOP_INVOKE__ !== 'function') throw Error('rdesktop bridge unavailable');
                const result = await window.__RDESKTOP_INVOKE__('greet', { name });
                if (result?.success === false) throw Error(result.data?.error || 'The greeting request failed.');
                const message = result?.data?.message ?? result?.message;
                if (typeof message !== 'string') throw Error('The host did not return a greeting.');
                resultEl.textContent = message;
            } catch (error) {
                resultEl.textContent = 'Error: ' + (error instanceof Error ? error.message : String(error));
            }
        }
    </script>
</body>
</html>
