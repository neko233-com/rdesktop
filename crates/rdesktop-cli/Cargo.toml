[package]
name = "rdesktop-cli"
description = "CLI tool for rdesktop framework"
version = "0.1.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "rdesktop"
path = "src/main.rs"

[dependencies]
rdesktop-core = { workspace = true }
rdesktop-dev = { workspace = true }
rdesktop-bundler = { workspace = true }
rdesktop-assets = { version = "0.1.7", path = "../rdesktop-assets" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tokio = { workspace = true }

[features]
default = []
