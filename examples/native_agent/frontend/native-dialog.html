<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Native dialog fixture</title>
<style>body{font:16px system-ui;margin:32px;background:#f4f5f7;color:#202630}button{font:inherit;padding:12px;background:#194c9e;color:white;border:1px solid #123b80;border-radius:5px}:focus-visible{outline:3px solid #19263d;outline-offset:3px}output{display:block;margin-top:20px}</style></head>
<body><main><h1>Native modal dialog</h1><p>This button opens a real Windows dialog owned by this renderer.</p><button id="native-dialog">Open native Windows dialog</button><output id="status" role="status">Ready</output>
<p><label for="native-file">WebView2 native file picker</label></p><input type="file" id="native-file"><output id="file-status" role="status">No file selected</output></main>
<script>const button=document.querySelector('#native-dialog'),file=document.querySelector('#native-file');if(typeof window.__RDESKTOP_INVOKE__!=='function'){button.disabled=true;file.disabled=true;document.querySelector('#status').textContent='Run this fixture through rdesktop dev to open the real Windows dialog.';}button.onclick=async()=>{document.querySelector('#status').textContent='Opening native dialog';try{const result=await window.__RDESKTOP_INVOKE__('native_dialog',{});document.querySelector('#status').textContent=result.success?'Native dialog request completed':'Native dialog request failed';}catch{document.querySelector('#status').textContent='Native dialog request failed';}};file.addEventListener('cancel',()=>document.querySelector('#file-status').textContent='Native file picker canceled');file.addEventListener('change',()=>document.querySelector('#file-status').textContent='File selection changed');</script></body></html>
