[package]
name = "native_agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rdesktop-core = { workspace = true }
rdesktop-webview = { workspace = true }
serde_json = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_UI_WindowsAndMessaging"]}

[features]
native-agent = ["rdesktop-webview/native-agent"]
